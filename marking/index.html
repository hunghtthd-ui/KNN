    <div id="game-container" class="w-full max-w-2xl bg-white rounded-3xl shadow-2xl p-6 md:p-8 relative overflow-hidden">

    <script>
        let currentQuestions = [];
        let currentIndex = 0;
        let selectedOptionIdx = null;
        let wrongAttempts = 0;
        let totalCorrect = 0;
        let totalWrong = 0;
        let isAnsweringLocked = false;

        // Audio Context for beeps (fallback for sound effects)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration) {
            const oscillator = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            oscillator.connect(gain);
            gain.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        function playCorrectSound() { playTone(880, 'sine', 0.5); }
        function playWrongSound() { playTone(220, 'square', 0.3); }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.75; // Slow
            
            // Find a female voice if possible
            const voices = window.speechSynthesis.getVoices();
            const femaleVoice = voices.find(v => v.name.includes('Female') || v.name.includes('Google US English'));
            if (femaleVoice) utterance.voice = femaleVoice;
            
            window.speechSynthesis.speak(utterance);
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }


        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            // Select 15 random unique questions
            const shuffled = shuffle([...VOCAB_DATA]);
            currentQuestions = shuffled.slice(0, 15);
            
            currentIndex = 0;
            totalCorrect = 0;
            totalWrong = 0;
            loadQuestion();
        }

        function loadQuestion() {
            isAnsweringLocked = false;
            selectedOptionIdx = null;
            wrongAttempts = 0;
            document.getElementById('feedback-overlay').classList.add('hidden');
            document.getElementById('confirm-btn').disabled = true;
            document.getElementById('attempts-left').innerText = "";

            const q = currentQuestions[currentIndex];
            
            // UI Progress
            document.getElementById('progress-text').innerText = `Question ${currentIndex + 1}/15`;
            document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / 15) * 100}%`;
            document.getElementById('english-word').innerText = q.en;

            // Generate options
            let options = [{vi: q.vi, correct: true}];
            const others = VOCAB_DATA.filter(item => item.vi !== q.vi);
            const shuffledOthers = shuffle([...others]);
            
            for(let i=0; i<3; i++) {
                options.push({vi: shuffledOthers[i].vi, correct: false});
            }
            options = shuffle(options);

            const grid = document.getElementById('options-grid');
            grid.innerHTML = "";
            options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "option-card text-left p-4 rounded-xl border-2 border-gray-200 transition-all hover:border-sky-300 bg-white text-gray-700 font-medium text-lg flex items-center gap-3";
                btn.innerHTML = `<span class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-sm font-bold text-gray-400">${String.fromCharCode(65 + index)}</span> <span>${opt.vi}</span>`;
                btn.onclick = () => selectOption(index, btn);
                grid.appendChild(btn);
                if(opt.correct) btn.dataset.correct = "true";
            });

            // Auto speak
            setTimeout(() => speak(q.en), 500);
        }

        function selectOption(index, element) {
            if (isAnsweringLocked) return;
            
            speak(currentQuestions[currentIndex].en);

            const cards = document.querySelectorAll('.option-card');
            cards.forEach(c => c.classList.remove('selected', 'border-sky-500'));
            
            element.classList.add('selected', 'border-sky-500');
            selectedOptionIdx = index;
            document.getElementById('confirm-btn').disabled = false;
        }

        function repeatSpeech() {
            speak(currentQuestions[currentIndex].en);
        }

        function checkAnswer() {
            if (selectedOptionIdx === null || isAnsweringLocked) return;

            const cards = document.querySelectorAll('.option-card');
            const selectedCard = cards[selectedOptionIdx];
            const isCorrect = selectedCard.dataset.correct === "true";

            if (isCorrect) {
                handleSuccess();
            } else {
                handleFailure(selectedCard);
            }
        }

        function handleSuccess() {
            isAnsweringLocked = true;
            totalCorrect++;
            playCorrectSound();
            
            const overlay = document.getElementById('feedback-overlay');
            const title = document.getElementById('feedback-title');
            const msg = document.getElementById('feedback-msg');
            const icon = document.getElementById('feedback-icon');

            title.innerText = PRAISES[Math.floor(Math.random() * PRAISES.length)];
            title.className = "text-3xl font-bold mb-2 text-emerald-500 correct-anim";
            msg.innerText = `"${currentQuestions[currentIndex].en}" means "${currentQuestions[currentIndex].vi}"`;
            icon.innerHTML = `<div class="w-20 h-20 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg></div>`;
            
            overlay.classList.remove('hidden');
            
            // Speak the praise
            const praiseSpeak = new SpeechSynthesisUtterance(title.innerText);
            praiseSpeak.rate = 1;
            window.speechSynthesis.speak(praiseSpeak);
        }

        function handleFailure(card) {
            wrongAttempts++;
            playWrongSound();
            
            card.classList.add('border-red-500', 'bg-red-50');
            card.classList.remove('selected', 'border-sky-500');
            selectedOptionIdx = null;
            document.getElementById('confirm-btn').disabled = true;

            if (wrongAttempts >= 3) {
                isAnsweringLocked = true;
                totalWrong++;
                showCorrectAnswer();
            } else {
                document.getElementById('attempts-left').innerText = `Try again! (${3 - wrongAttempts} attempts left)`;
                // Visual shake
                card.animate([
                    { transform: 'translateX(0px)' },
                    { transform: 'translateX(-10px)' },
                    { transform: 'translateX(10px)' },
                    { transform: 'translateX(0px)' }
                ], { duration: 200 });
            }
        }

        function showCorrectAnswer() {
            const overlay = document.getElementById('feedback-overlay');
            const title = document.getElementById('feedback-title');
            const msg = document.getElementById('feedback-msg');
            const icon = document.getElementById('feedback-icon');

            title.innerText = "Keep learning!";
            title.className = "text-3xl font-bold mb-2 text-orange-500";
            msg.innerHTML = `The correct answer for <span class="font-bold text-sky-600">${currentQuestions[currentIndex].en}</span> is:<br><span class="text-xl text-gray-800 mt-2 block">${currentQuestions[currentIndex].vi}</span>`;
            icon.innerHTML = `<div class="w-20 h-20 bg-orange-100 text-orange-500 rounded-full flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></div>`;
            
            overlay.classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < 15) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('feedback-overlay').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            document.getElementById('final-correct').innerText = totalCorrect;
            document.getElementById('final-wrong').innerText = totalWrong;
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const overlay = document.getElementById('feedback-overlay');
                if (!overlay.classList.contains('hidden')) {
                    nextQuestion();
                } else if (!document.getElementById('confirm-btn').disabled) {
                    checkAnswer();
                } else if (!document.getElementById('start-screen').classList.contains('hidden')) {
                    startGame();
                }
            }
        });

        // Initialize voices
        window.speechSynthesis.onvoiceschanged = () => {
            // Some browsers need this to pre-load voices
            window.speechSynthesis.getVoices();
        };

    </script>
</body>
</html>
